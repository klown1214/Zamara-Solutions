<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCK Batch Plant — Sales CRM | Zamara Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #D4910A;
  --gold-light: #F0A820;
  --gold-dim: #7A5200;
  --dark: #0E0E0C;
  --dark-2: #161614;
  --dark-3: #1E1E1B;
  --dark-4: #272724;
  --dark-5: #323230;
  --mid: #4A4A46;
  --muted: #7A7A74;
  --dim: #A8A8A0;
  --light: #D8D8D0;
  --white: #F4F4EE;
  --green: #27AE60;
  --green-dim: #1A6B3C;
  --red: #C0392B;
  --blue: #2980B9;
  --purple: #8E44AD;
  --radius: 8px;
  --radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--dark);
  color: var(--light);
  min-height: 100vh;
  font-size: 14px;
}

/* HEADER */
.header {
  background: var(--dark-2);
  border-bottom: 1px solid var(--dark-5);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo-wrap { height: 40px; display: flex; align-items: center; }
.logo-wrap img { height: 38px; width: auto; border-radius: 4px; }
.header-divider { width: 1px; height: 28px; background: var(--dark-5); }
.header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 16px;
  color: var(--white); letter-spacing: 0.5px; text-transform: uppercase;
}
.header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.nav-link {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted); text-decoration: none;
  padding: 5px 12px; border-radius: 4px; transition: all 0.2s;
  border: 1px solid var(--dark-5);
}
.nav-link:hover { color: var(--gold-light); border-color: var(--gold-dim); }
.powered-tag {
  font-size: 10px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: var(--gold-dim);
  border: 1px solid var(--gold-dim); padding: 4px 10px; border-radius: 4px;
}

/* STAT CARDS */
.stats-wrap { padding: 24px 32px 0; display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; }
.stat-card {
  background: var(--dark-2); border: 1px solid var(--dark-5);
  border-radius: var(--radius-lg); padding: 16px 18px; position: relative; overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: var(--dark-5);
}
.stat-card.gold::before { background: var(--gold); }
.stat-card.green::before { background: var(--green); }
.stat-card.blue::before { background: var(--blue); }
.stat-card.red::before { background: var(--red); }
.stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
.stat-value { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; color: var(--white); line-height: 1; }
.stat-value.gold { color: var(--gold-light); }
.stat-value.green { color: #58D68D; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* TOOLBAR */
.toolbar {
  padding: 20px 32px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.toolbar-left { display: flex; align-items: center; gap: 10px; }
.toolbar-right { display: flex; align-items: center; gap: 10px; }
.filter-btn {
  background: var(--dark-3); border: 1px solid var(--dark-5);
  border-radius: var(--radius); padding: 8px 14px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--muted); cursor: pointer; transition: all 0.2s;
  font-family: 'Barlow', sans-serif;
}
.filter-btn:hover { border-color: var(--gold-dim); color: var(--gold-light); }
.filter-btn.active { background: rgba(212,145,10,0.12); border-color: var(--gold); color: var(--gold-light); }
.view-toggle {
  display: flex; background: var(--dark-3); border: 1px solid var(--dark-5);
  border-radius: var(--radius); overflow: hidden;
}
.view-btn {
  padding: 8px 14px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted);
  cursor: pointer; transition: all 0.2s; border: none;
  background: transparent; font-family: 'Barlow', sans-serif;
}
.view-btn.active { background: var(--dark-5); color: var(--white); }
.section-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 18px;
  font-weight: 700; color: var(--white); text-transform: uppercase; letter-spacing: 0.5px;
}

/* PIPELINE BOARD */
.pipeline { padding: 0 32px 32px; display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; align-items: start; }
.pipeline-col { }
.col-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-radius: var(--radius) var(--radius) 0 0;
  margin-bottom: 8px; border-bottom: 2px solid transparent;
}
.col-header.pending { background: rgba(74,74,70,0.3); border-color: var(--mid); }
.col-header.quoted { background: rgba(41,128,185,0.1); border-color: var(--blue); }
.col-header.followup { background: rgba(212,145,10,0.1); border-color: var(--gold); }
.col-header.won { background: rgba(39,174,96,0.1); border-color: var(--green); }
.col-header.lost { background: rgba(192,57,43,0.08); border-color: var(--red); }
.col-title {
  font-family: 'Barlow Condensed', sans-serif; font-size: 12px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
}
.col-count {
  font-size: 11px; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; background: var(--dark-4); color: var(--muted);
}
.col-cards { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }

/* BID CARD */
.bid-card {
  background: var(--dark-2); border: 1px solid var(--dark-5);
  border-radius: var(--radius-lg); padding: 14px 16px;
  cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
}
.bid-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
}
.bid-card.william::before { background: var(--gold); }
.bid-card.robby::before { background: var(--blue); }
.bid-card.alex::before { background: var(--purple); }
.bid-card.live::before { background: var(--green); }
.bid-card:hover { border-color: var(--dark-4); background: var(--dark-3); transform: translateY(-1px); }
.bid-project { font-size: 12px; font-weight: 600; color: var(--white); margin-bottom: 4px; line-height: 1.3; }
.bid-client { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.bid-meta { display: flex; align-items: center; justify-content: space-between; }
.bid-yards { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: var(--gold-light); }
.bid-rev { font-size: 11px; color: var(--dim); }
.rep-tag {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 2px 6px; border-radius: 3px;
}
.rep-tag.william { background: rgba(212,145,10,0.15); color: var(--gold); border: 1px solid var(--gold-dim); }
.rep-tag.robby { background: rgba(41,128,185,0.15); color: #5DADE2; border: 1px solid rgba(41,128,185,0.4); }
.rep-tag.alex { background: rgba(142,68,173,0.15); color: #C39BD3; border: 1px solid rgba(142,68,173,0.4); }
.rep-tag.live { background: rgba(39,174,96,0.15); color: #58D68D; border: 1px solid rgba(39,174,96,0.4); }
.bid-date { font-size: 10px; color: var(--mid); margin-top: 6px; }
.followup-flag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; color: var(--gold); margin-top: 6px;
}
.live-badge {
  position: absolute; top: 10px; right: 10px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
  background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.4);
  color: #58D68D; padding: 2px 6px; border-radius: 3px; text-transform: uppercase;
}

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 24px; opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--dark-2); border: 1px solid var(--dark-5);
  border-radius: var(--radius-lg); width: 100%; max-width: 640px;
  max-height: 85vh; overflow-y: auto;
  transform: translateY(20px); transition: transform 0.2s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-head {
  padding: 20px 24px; border-bottom: 1px solid var(--dark-5);
  display: flex; align-items: flex-start; justify-content: space-between;
}
.modal-title { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: var(--white); text-transform: uppercase; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
.modal-close:hover { color: var(--white); }
.modal-body { padding: 20px 24px; }
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
.modal-field label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); display: block; margin-bottom: 3px; }
.modal-field value { font-size: 13px; color: var(--white); font-weight: 500; display: block; }
.modal-mixes { margin-top: 16px; }
.mix-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--dark-3); border-radius: 6px; margin-bottom: 6px;
}
.mix-code { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: var(--gold-light); }
.mix-app { font-size: 12px; color: var(--dim); }
.mix-vol { font-size: 12px; font-weight: 600; color: var(--white); }
.status-select {
  width: 100%; background: var(--dark-3); border: 1px solid var(--dark-5);
  border-radius: var(--radius); padding: 9px 12px; font-size: 13px;
  color: var(--white); font-family: 'Barlow', sans-serif; cursor: pointer;
  margin-top: 16px;
}
.status-select:focus { outline: none; border-color: var(--gold); }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn-outline {
  flex: 1; background: transparent; border: 1px solid var(--dark-5);
  border-radius: var(--radius); padding: 10px; font-size: 12px;
  font-weight: 600; color: var(--dim); cursor: pointer; transition: all 0.2s;
  font-family: 'Barlow', sans-serif;
}
.btn-outline:hover { border-color: var(--gold-dim); color: var(--gold-light); }
.btn-gold {
  flex: 1; background: var(--gold); border: none; border-radius: var(--radius);
  padding: 10px; font-size: 12px; font-weight: 700; color: var(--dark);
  cursor: pointer; transition: all 0.2s;
  font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; text-transform: uppercase;
}
.btn-gold:hover { background: var(--gold-light); }

/* MANAGER VIEW */
.manager-grid { padding: 0 32px 32px; display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
.rep-card {
  background: var(--dark-2); border: 1px solid var(--dark-5);
  border-radius: var(--radius-lg); overflow: hidden;
}
.rep-card-head {
  padding: 16px 20px; border-bottom: 1px solid var(--dark-5);
  display: flex; align-items: center; gap: 12px;
}
.rep-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
}
.rep-avatar.william { background: rgba(212,145,10,0.2); color: var(--gold); border: 1px solid var(--gold-dim); }
.rep-avatar.robby { background: rgba(41,128,185,0.2); color: #5DADE2; border: 1px solid rgba(41,128,185,0.4); }
.rep-avatar.alex { background: rgba(142,68,173,0.2); color: #C39BD3; border: 1px solid rgba(142,68,173,0.4); }
.rep-name { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--white); text-transform: uppercase; }
.rep-title { font-size: 11px; color: var(--muted); }
.rep-stats { padding: 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rep-stat label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); display: block; margin-bottom: 3px; }
.rep-stat value { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: var(--white); display: block; }
.rep-stat value.gold { color: var(--gold-light); }
.rep-stat value.green { color: #58D68D; }
.rep-bids { padding: 0 20px 16px; }
.rep-bid-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; background: var(--dark-3); border-radius: 6px; margin-bottom: 5px;
  font-size: 11px;
}
.rep-bid-name { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
.status-dot-label { display: flex; align-items: center; gap: 5px; }
.sdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sdot.pending { background: var(--mid); }
.sdot.quoted { background: var(--blue); }
.sdot.followup { background: var(--gold); }
.sdot.won { background: var(--green); }
.sdot.lost { background: var(--red); }

/* EMPTY PIPELINE COL */
.empty-col { padding: 20px; text-align: center; font-size: 11px; color: var(--mid); border: 1px dashed var(--dark-5); border-radius: var(--radius); }

.separator { height: 1px; background: var(--dark-5); margin: 0 32px 20px; }
</style>
</head>

<!-- MANAGER VIEW -->

</div>

let allBids = [...DUMMY_BIDS];
let currentRep = 'all';
let currentView = 'pipeline';
let selectedBidId = null;

// Load live bids from localStorage (from Bid Analyzer)
function loadLiveBids() {
  try {
    const live = localStorage.getItem('zamara_crm_entries');
    if (live) {
      const entries = JSON.parse(live);
      entries.forEach(e => {
        if (!allBids.find(b => b.id === e.id)) {
          allBids.unshift({ ...e, rep: e.rep || 'William', status: e.status || 'pending' });
        }
      });
    }
  } catch(err) { console.log('No live bids in localStorage'); }
}

function getFilteredBids() {
  if (currentRep === 'all') return allBids;
  return allBids.filter(b => b.rep === currentRep);
}

function filterRep(rep, btn) {
  currentRep = rep;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('viewPipeline').style.display = view === 'pipeline' ? 'block' : 'none';
  document.getElementById('viewManager').style.display = view === 'manager' ? 'block' : 'none';
  document.getElementById('viewLabel').textContent = view === 'pipeline' ? 'Pipeline Board' : 'Manager View';
  render();
}

function fmtRev(n) {
  if (!n) return 'TBD';
  if (n >= 1000000) return '$' + (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + Math.round(n/1000) + 'K';
  return '$' + n.toLocaleString();
}

function statusLabel(s) {
  return { pending: 'Pending', quoted: 'Quoted', followup: 'Follow Up', won: 'Won', lost: 'Lost' }[s] || s;
}

function repClass(rep) {
  return rep.toLowerCase();
}

function makeCard(bid) {
  const isLive = bid.live;
  const repCls = repClass(bid.rep);
  return `<div class="bid-card ${repCls}${isLive?' live':''}" onclick="openModal('${bid.id}')">
    ${isLive ? '<div class="live-badge">● Live</div>' : ''}
    <div class="bid-project">${bid.project}</div>
    <div class="bid-client">${bid.client}</div>
    <div class="bid-meta">
      <div>
        <div class="bid-yards">${bid.yards ? bid.yards.toLocaleString() + ' CY' : 'TBD'}</div>
        <div class="bid-rev">${fmtRev(bid.revenue)}</div>
      </div>
      <span class="rep-tag ${repCls}">${bid.rep}</span>
    </div>
    ${bid.followup ? `<div class="followup-flag">📅 Follow up: ${bid.followup}</div>` : ''}
    <div class="bid-date">Bid: ${bid.bid_date || '—'} · Exp: ${bid.expiry || '—'}</div>
  </div>`;
}

function renderPipeline() {
  const statuses = ['pending', 'quoted', 'followup', 'won', 'lost'];
  const filtered = getFilteredBids();

  statuses.forEach(s => {
    const col = document.getElementById('col-' + s);
    const cnt = document.getElementById('cnt-' + s);
    const bids = filtered.filter(b => b.status === s);
    cnt.textContent = bids.length;
    if (bids.length === 0) {
      col.innerHTML = `<div class="empty-col">No bids</div>`;
    } else {
      col.innerHTML = bids.map(makeCard).join('');
    }
  });
}

function renderManager() {
  const reps = ['William', 'Robby', 'Alex'];
  const grid = document.getElementById('managerGrid');
  grid.innerHTML = reps.map(rep => {
    const bids = allBids.filter(b => b.rep === rep);
    const open = bids.filter(b => !['won','lost'].includes(b.status));
    const won = bids.filter(b => b.status === 'won');
    const lost = bids.filter(b => b.status === 'lost');
    const closed = won.length + lost.length;
    const closeRate = closed > 0 ? Math.round((won.length / closed) * 100) + '%' : '—';
    const totalYards = bids.reduce((s,b) => s + (b.yards||0), 0);
    const pipelineRev = open.reduce((s,b) => s + (b.revenue||0), 0);
    const repCls = repClass(rep);

    const bidRows = bids.slice(0,5).map(b => `
      <div class="rep-bid-row">
        <span class="rep-bid-name">${b.project}</span>
        <span class="status-dot-label">
          <span class="sdot ${b.status}"></span>
          <span style="font-size:10px;color:var(--muted)">${statusLabel(b.status)}</span>
        </span>
      </div>`).join('');

    return `<div class="rep-card">
      <div class="rep-card-head">
        <div class="rep-avatar ${repCls}">${rep[0]}</div>
        <div>
          <div class="rep-name">${rep}</div>
          <div class="rep-title">Sales Representative</div>
        </div>
      </div>
      <div class="rep-stats">
        <div class="rep-stat"><label>Open Bids</label><value>${open.length}</value></div>
        <div class="rep-stat"><label>Pipeline</label><value class="gold">${fmtRev(pipelineRev)}</value></div>
        <div class="rep-stat"><label>Total CY</label><value>${totalYards.toLocaleString()}</value></div>
        <div class="rep-stat"><label>Close Rate</label><value class="${won.length > 0 ? 'green' : ''}">${closeRate}</value></div>
      </div>
      <div class="rep-bids">${bidRows}</div>
    </div>`;
  }).join('');
}

function renderStats() {
  const filtered = getFilteredBids();
  const open = filtered.filter(b => !['won','lost'].includes(b.status));
  const won = filtered.filter(b => b.status === 'won');
  const lost = filtered.filter(b => b.status === 'lost');
  const closed = won.length + lost.length;

  document.getElementById('statOpen').textContent = open.length;
  document.getElementById('statPipeline').textContent = fmtRev(open.reduce((s,b) => s+(b.revenue||0),0));
  document.getElementById('statWon').textContent = fmtRev(won.reduce((s,b) => s+(b.revenue||0),0));
  document.getElementById('statWonYards').textContent = won.reduce((s,b)=>s+(b.yards||0),0).toLocaleString() + ' CY won';
  document.getElementById('statYards').textContent = filtered.reduce((s,b)=>s+(b.yards||0),0).toLocaleString();
  document.getElementById('statClose').textContent = closed > 0 ? Math.round((won.length/closed)*100)+'%' : '—';
}

function render() {
  renderStats();
  if (currentView === 'pipeline') renderPipeline();
  else renderManager();
}

function openModal(id) {
  const bid = allBids.find(b => b.id === id);
  if (!bid) return;
  selectedBidId = id;

  document.getElementById('modalTitle').textContent = bid.project;
  document.getElementById('modalClient').textContent = bid.client + (bid.type ? ' · ' + bid.type : '');
  document.getElementById('modalStatus').value = bid.status;

  document.getElementById('modalGrid').innerHTML = `
    <div class="modal-field"><label>Contact</label><value>${bid.contact||'—'}</value></div>
    <div class="modal-field"><label>Phone</label><value>${bid.phone||'—'}</value></div>
    <div class="modal-field"><label>Email</label><value>${bid.email||'—'}</value></div>
    <div class="modal-field"><label>Project Address</label><value>${bid.address||'—'}</value></div>
    <div class="modal-field"><label>Est. Yardage</label><value>${bid.yards ? bid.yards.toLocaleString()+' CY' : 'TBD'}</value></div>
    <div class="modal-field"><label>Est. Revenue</label><value>${fmtRev(bid.revenue)}</value></div>
    <div class="modal-field"><label>Bid Date</label><value>${bid.bid_date||'—'}</value></div>
    <div class="modal-field"><label>Expiration</label><value>${bid.expiry||'—'}</value></div>
    <div class="modal-field" style="grid-column:1/-1"><label>Notes</label><value>${bid.notes||'—'}</value></div>
  `;

  if (bid.mixes && bid.mixes.length) {
    document.getElementById('modalMixes').innerHTML = '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:8px">Mix Codes</div>'
      + bid.mixes.map(m => `<div class="mix-row">
          <span class="mix-code">${m.code}</span>
          <span class="mix-app">${m.app}</span>
          <span class="mix-vol">${m.vol ? m.vol.toLocaleString()+' CY' : 'TBD'}</span>
        </div>`).join('');
  } else {
    document.getElementById('modalMixes').innerHTML = '';
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  selectedBidId = null;
}

function updateStatus() {
  if (!selectedBidId) return;
  const bid = allBids.find(b => b.id === selectedBidId);
  if (bid) {
    bid.status = document.getElementById('modalStatus').value;
    render();
  }
}

// Init
loadLiveBids();
render();
</script>
